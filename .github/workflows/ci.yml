name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out jt-web
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node 24.13.1
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.13.1
          cache: npm

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
        with:
          chrome-version: stable

      - name: Install dependencies
        run: npm ci

      - name: Unit suite
        run: npm run test:unit

      - name: wasm and JavaScript parity
        run: npm run test:parity

      - name: Vocabulary gate
        run: npm run check:vocabulary

      - name: Production build
        run: npm run build:pilot

      - name: Headless Chrome e2e suites
        run: npm run test:e2e
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Sync relay e2e suite
        run: npm run test:e2e:sync
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          JT_SYNC_REPO: ${{ github.workspace }}/vendor/jt-sync-runner

      - name: Finalize and verify PWA receipt
        run: |
          node scripts/write-build-receipt.mjs
          node --test test/pilot-artifact.test.mjs

      - name: Retain exact PWA pilot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: jt-pwa-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
