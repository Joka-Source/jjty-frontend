name: web quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Build the Sites artifact
        run: npm run build
      - name: Verify render, indexing, accessibility, performance, and recovery contracts
        run: npm run test:contracts
