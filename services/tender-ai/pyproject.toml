[project]
name = "jjty-tender-ai"
version = "0.1.0"
description = "Self-hosted, source-grounded tender document intelligence"
requires-python = ">=3.11"
dependencies = [
  "docling>=2.70,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tender_ai"]
