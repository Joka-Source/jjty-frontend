[project]
name = "jjty-tender-ai"
version = "0.1.0"
description = "Self-hosted, source-grounded tender document intelligence"
requires-python = ">=3.11"
dependencies = [
  "docling>=2.70,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  # Direct declarations let uv apply the platform-specific CPU wheel source to
  # Docling's transitive PyTorch dependencies.
  "torch>=2.2",
  "torchvision>=0.17",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tender_ai"]

# Docling uses PyTorch for document models. Linux production images must resolve
# the CPU wheels explicitly; PyPI's generic Linux resolution otherwise pulls
# several gigabytes of CUDA libraries that this service never uses.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
